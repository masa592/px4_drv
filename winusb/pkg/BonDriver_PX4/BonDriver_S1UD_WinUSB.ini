[SYSTEM]
; チューナー識別名 (TVTestなどの表示名)
TunerName="PX-S1UD"

; 対象チューナーのインデックス (0から始まる連番)
; DLLファイル名末尾の数字 (例: BonDriver_S1UD_WinUSB_0.dll -> 0, BonDriver_S1UD_WinUSB_1.dll -> 1)
; が設定されている場合はそちらが自動優先されます。
DeviceIndex=0

; Siano ファームウェアファイルのパス (省略時はDLLと同じディレクトリの isdbt_rio.inp / isdbt_nova_12mhz_b0.inp 等を自動検索)
FirmwarePath=""

; NULLパケット (PID=0x1FFF) を破棄して転送負荷を軽減するかどうか (0: 無効, 1: 有効)
DiscardNullPackets=0
